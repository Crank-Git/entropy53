version: "2"

run:
  # The interop files carry this build tag, and the linter skips them without it.
  build-tags:
    - interop

linters:
  enable:
    - gocyclo
    - nestif
    - unused
    - errcheck
  settings:
    gocyclo:
      # A function above this complexity fails the lint run.
      min-complexity: 15
