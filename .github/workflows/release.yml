name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # The release runs only for a tag on main.
      - name: Check that the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main. No release." >&2
            exit 1
          fi
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # A failed build stops the job, so the release step never runs.
      - name: Build binaries and checksum file
        run: scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
